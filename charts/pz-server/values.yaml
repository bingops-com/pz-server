---
image:
  repository: ghcr.io/bingops-com/pz-server
  tag: "0.1.2"
  pullPolicy: IfNotPresent

steam:
  # Empty selects the stable Steam branch, which is Build 42.
  beta: ""
  validate: false

server:
  name: bingops
  secret:
    existingSecret: pz-server-secrets
    adminPasswordKey: ADMIN_PASSWORD
    serverPasswordKey: SERVER_PASSWORD
    rconPasswordKey: RCON_PASSWORD
  ports:
    game: 16261
    direct: 16262
    rcon: 27015
  ini:
    PVP: false
    PauseEmpty: true
    GlobalChat: true
    ChatStreams: s,r,a,w,y,sh,f,all
    Open: true
    AutoCreateUserInWhiteList: false
    DisplayUserName: true
    ShowFirstAndLastName: false
    SpawnPoint: 0,0,0
    SafetySystem: true
    ShowSafety: true
    SafetyToggleTimer: 2
    SafetyCooldownTimer: 3
    DefaultPort: 16261
    UDPPort: 16262
    Map: Muldraugh, KY
    DoLuaChecksum: true
    DenyLoginOnOverloadedServer: true
    Public: false
    PublicName: My PZ Server
    PublicDescription: ""
    MaxPlayers: 16
    PingLimit: 400
    HoursForLootRespawn: 0
    MaxItemsForLootRespawn: 4
    ConstructionPreventsLootRespawn: true
    DropOffWhiteListAfterDeath: false
    NoFire: false
    AnnounceDeath: false
    MinutesPerPage: 0.1
    SaveWorldEveryMinutes: 0
    PlayerSafehouse: false
    AdminSafehouse: false
    SafehouseAllowTrepass: true
    SafehouseAllowFire: true
    SafehouseAllowLoot: true
    SafehouseAllowRespawn: false
    SafehouseDaySurvivedToClaim: 0
    SafeHouseRemovalTime: 144
    AllowDestructionBySledgehammer: true
    KickFastPlayers: false
    RCONPort: 27015
    MaxAccountsPerUser: 1
    AllowCoop: true
    SleepAllowed: false
    SleepNeeded: false
    SteamScoreboard: true
    SteamVAC: true
    UPnP: false
    VoiceEnable: true
    VoiceMinDistance: 10.0
    VoiceMaxDistance: 100.0
    Voice3D: true
    SpeedLimit: 70.0
    Faction: true
    MapRemotePlayerVisibility: 3
    BackupsCount: 5
    BackupsOnStart: true
    BackupsOnVersionChange: true
    BackupsPeriod: 0
  sandbox:
    VERSION: 6
    Zombies: 5
    XpMultiplier: 3
    XpMultiplierAffectsPassive: true
    VehicleEasyUse: true
    StarterKit: true
    LightBulbLifespan: 10
    AllowMiniMap: true

