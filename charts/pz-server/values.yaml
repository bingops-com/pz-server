service:
  type: NodePort
  nodePorts:
    game: 30261
    direct: 30262
  externalTrafficPolicy: Local

persistence:
  storageClass: local-path
  size: 50Gi
  accessModes: [ReadWriteOnce]
  keep: true

resources:
  requests:
    cpu: "2"
    memory: 8Gi
  limits:
    cpu: "6"
    memory: 16Gi

backup:
  enabled: true
  schedule: "30 3 * * *"
  endpoint: https://4d31056d6b4bf143606ff3ca757e0b8c.r2.cloudflarestorage.com
  bucket: bingops-pz-labprod
  prefix: server
  secret:
    existingSecret: pz-r2-credentials
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    repositoryPasswordKey: RESTIC_PASSWORD
  retention:
    daily: 7
    weekly: 4
    monthly: 6

restore:
  enabled: false
  # Change for every requested restore so the Job name is immutable and unique.
  id: ""
  snapshot: latest

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}
