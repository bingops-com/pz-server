name: runtime-safety
on:
  push:
    branches: [master, feat/gaming-as-a-service]
    paths: ['docker/scripts/**', 'docker/tests/**', 'gaas/**', '.github/workflows/runtime-safety.yml']
  pull_request:
    branches: [master]
    paths: ['docker/scripts/**', 'docker/tests/**', 'gaas/**', '.github/workflows/runtime-safety.yml']
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.4
      - name: Install the YAML parser used by the runtime adapter tests
        run: python3 -m pip install PyYAML==6.0.2
      - name: Check shell syntax
        run: bash -n docker/scripts/backup.sh
      - name: Check backup safety without infrastructure
        run: python3 -m unittest discover -s docker/tests -v
      - name: Check game lifecycle and gateway safeguards without infrastructure
        run: python3 -m unittest discover -s gaas/tests -v
